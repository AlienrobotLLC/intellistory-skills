name: secret-scan
# This repo is public. Fail fast if anything that looks like a credential is committed.
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: grep for credential shapes
        run: |
          set -e
          PATTERNS='is_ws_(live|test)_[A-Za-z0-9_-]{8,}|is_pj_(live|test)_[A-Za-z0-9_-]{8,}|sk_(live|test)_[A-Za-z0-9]{8,}|pk_live_[A-Za-z0-9]{8,}|service_role|eyJhbGciOi[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|npm_[A-Za-z0-9]{20,}'
          if grep -rIEn --exclude-dir=.git --exclude=secret-scan.yml "$PATTERNS" . ; then
            echo "::error::credential-shaped string found — remove it before pushing to a public repo"
            exit 1
          fi
          echo "clean"
